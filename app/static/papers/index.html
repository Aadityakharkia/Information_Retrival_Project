<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SearchBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/papers/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 24 Q16 2 29 24' fill='none' stroke='%232747A8' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M3 27h26' stroke='%23138A7E' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/papers#/" aria-label="SearchBridge papers home">
      <svg viewBox="0 0 40 24" aria-hidden="true"><path d="M3 20 Q20 -4 37 20" class="arch"/><path d="M2 21.5h36" class="deck"/><path d="M11 9v12M20 4v17M29 9v12" class="cables"/></svg>
      <span>SearchBridge</span>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#/" data-route="search">Search</a>
      <a href="#/compare" data-route="compare">Compare</a>
      <a href="#/library" data-route="library">My library</a>
      <a href="#/graph" data-route="graph">Concept map</a>
      <a href="#/insights" data-route="insights">Index</a>
      <a href="#/evaluation" data-route="evaluation">Evaluation</a>
      <a href="#/trust" data-route="trust">Trust &amp; privacy</a>
    </nav>
    <div class="topbar-right">
      <label class="coll-select">
        <span class="sr">Collection</span>
        <select id="collection"></select>
      </label>
      <button id="theme" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <div id="status-strip" class="status-strip" hidden></div>
  <main id="main" tabindex="-1"></main>
  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="Document reader">
    <div class="drawer-inner" id="drawer-body"></div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/papers/app.js"></script>
</body>
</html>
