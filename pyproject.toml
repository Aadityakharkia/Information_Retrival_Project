[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchbridge-ai"
version = "2.0.0"
description = "SearchBridge AI: an intelligent information retrieval system for smart document search"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "nltk>=3.8", "pypdf>=4.0"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
semantic = ["sentence-transformers>=2.6"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "httpx", "ruff"]
all = ["searchbridge-ai[web,semantic,plots,dev]"]

[project.scripts]
searchbridge = "searchbridge.cli:main"

[tool.setuptools.packages.find]
include = ["searchbridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E702", "E731", "E741", "B905"]
